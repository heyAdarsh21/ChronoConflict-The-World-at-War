{% extends "base.html" %}

{% block title %}Login - WW2 Intel Ops{% endblock %}

{% block content %}
<div class="auth-container">
    <div class="auth-box">
        <div class="auth-header">
            <h2>SECURITY CLEARANCE</h2>
            <p>Enter credentials for access</p>
        </div>
        
        <form method="POST" class="auth-form">
            <div class="form-group">
                <label>USERNAME</label>
                <input type="text" name="username" required class="form-input">
            </div>
            
            <div class="form-group">
                <label>PASSWORD</label>
                <input type="password" name="password" required class="form-input">
            </div>
            
            <button type="submit" class="btn-military btn-primary">AUTHENTICATE</button>
        </form>
        
        <div class="auth-footer">
            <a href="{{ url_for('auth.register') }}">Request new clearance</a>
            <a href="{{ url_for('index') }}">Return to base</a>
        </div>
    </div>
</div>
{% endblock %}
